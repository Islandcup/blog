<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="虫巢 —— 一个记录技术、阅读与生活的个人博客">
  <meta name="theme-color" content="#2d7d6a">
  <meta property="og:title" content="虫巢">
  <meta property="og:description" content="一个记录技术、阅读与生活的个人博客">
  <meta property="og:type" content="website">
  <title>虫巢 —— 个人博客</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪲</text></svg>">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <span class="logo-icon">🪲</span>
        <span>虫巢</span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </div>
  </nav>

  <!-- 首页头部 -->
  <header class="hero">
    <div class="container">
      <h1>欢迎来到 <span class="highlight">虫巢</span></h1>
      <p>一个记录技术、阅读与生活的数字巢穴。捕捉灵感如捕萤火，将每一缕微光珍藏于此。</p>
      <div class="hero-divider"></div>
    </div>
  </header>

  <!-- 文章列表 -->
  <main class="posts-section">
    <div class="container">
      <div class="section-header">
        <h2>📝 最新文章</h2>
        <span class="post-count" id="postCount"></span>
      </div>
      <div class="posts-list" id="postsList">
        <!-- 骨架屏加载状态 -->
        <div class="skeleton">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
        <div class="skeleton">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
        <div class="skeleton">
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 虫巢 · 用 🪲 记录世界</p>
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
